<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Simulateur Rhapsody</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#12161c; --panel:#1b222c; --line:#2b3544; --text:#d8e0ea; --dim:#8593a6; --accent:#4aa3ff; --ok:#3ecf8e; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; gap:16px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header h1 { font-size:16px; margin:0; }
  #status { padding:2px 10px; border-radius:10px; background:var(--bad); color:#000; font-size:12px; }
  #status.on { background:var(--ok); }
  #meta { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px; }
  @media (max-width: 1000px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:0 0 10px; }
  input, select, button { font:inherit; color:var(--text); background:#10151b; border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  button { cursor:pointer; background:#22344a; }
  button:hover { background:#2c4767; }
  #filter { width:100%; margin-bottom:8px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:2px 6px; border-bottom:1px solid #222b38; vertical-align:middle; }
  td.name { width:45%; word-break:break-all; }
  td.type { color:var(--dim); font-size:11px; width:90px; }
  td input[type=text], td input[type=number] { width:100%; }
  tr.flash td.val { animation: flash .8s; }
  @keyframes flash { from { background:#3b5d2f; } to { background:transparent; } }
  .inst { margin:0 0 14px; }
  .inst > summary { cursor:pointer; font-weight:600; padding:4px 0; }
  .ev { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .ev .evname { flex:1 1 100%; font-family:monospace; font-size:12px; }
  .ev input { flex:1; min-width:70px; }
  .ev small { color:var(--dim); }
  #log { height:220px; overflow:auto; font:12px monospace; background:#0d1116; padding:6px; border-radius:4px; }
  #log div.err { color:var(--bad); }
  #log div.evt { color:var(--accent); }
  .ro { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>Simulateur Rhapsody</h1>
  <span id="status">déconnecté</span>
  <span id="meta"></span>
  <span style="flex:1"></span>
  <button id="reset" title="Relance la simulation depuis le début">Reset Simulation</button>
</header>
<main>
  <section>
    <h2>Attributs</h2>
    <input id="filter" placeholder="Filtrer (nom d'attribut ou d'instance)…">
    <div id="attrs"></div>
  </section>
  <div>
    <section>
      <h2>Événements</h2>
      <input id="evfilter" placeholder="Filtrer…" style="width:100%;margin-bottom:8px">
      <div id="events"></div>
    </section>
    <section style="margin-top:16px">
      <h2>Journal</h2>
      <div id="log"></div>
    </section>
  </div>
</main>
<script src="sim-client.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const sim = new SimClient();
const cells = new Map(); // "inst.attr" -> { row, set(value) }
let schema = null;

function log(text, cls = '') {
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `${new Date().toLocaleTimeString()}  ${text}`;
  const box = $('#log');
  box.appendChild(d);
  while (box.childElementCount > 300) box.firstChild.remove();
  box.scrollTop = box.scrollHeight;
}
const report = (p, label) => p.catch((e) => log(`${label}: ${e.message}`, 'err'));

function classOf(id) {
  return schema.classes.find((c) => id === c.name || id.startsWith(c.name + '#'));
}

function editor(inst, attr, index) {
  const id = `${inst}.${attr.name}${index === undefined ? '' : `[${index}]`}`;
  let input;
  if (!attr.writable) {
    input = document.createElement('span');
    input.className = 'ro';
    return { el: input, set: (v) => (input.textContent = String(v)) };
  }
  const send = (v) => report(sim.set(inst, attr.name, v, index), `set ${id}`);
  if (attr.kind === 'bool') {
    input = document.createElement('input');
    input.type = 'checkbox';
    input.onchange = () => send(input.checked);
    return { el: input, set: (v) => (input.checked = !!v) };
  }
  input = document.createElement('input');
  input.type = attr.kind === 'string' ? 'text' : 'number';
  if (attr.kind === 'float') input.step = 'any';
  input.onkeydown = (e) => { if (e.key === 'Enter') input.blur(); };
  input.onchange = () => send(attr.kind === 'string' ? input.value : Number(input.value));
  return { el: input, set: (v) => { if (document.activeElement !== input) input.value = v; } };
}

function buildAttrs() {
  const root = $('#attrs');
  root.innerHTML = '';
  cells.clear();
  for (const inst of sim.instances) {
    const cls = classOf(inst.id);
    if (!cls) continue;
    const det = document.createElement('details');
    det.className = 'inst';
    det.open = true;
    det.innerHTML = `<summary>${inst.id}</summary>`;
    const table = document.createElement('table');
    for (const attr of cls.attributes) {
      const rows = attr.dims.length ? Array.from({ length: attr.dims[0] ?? 0 }, (_, i) => i) : [undefined];
      for (const index of rows) {
        const tr = document.createElement('tr');
        tr.dataset.search = `${inst.id}.${attr.name}`.toLowerCase();
        const ed = editor(inst.id, attr, index);
        tr.innerHTML = `<td class="name">${attr.name}${index === undefined ? '' : `[${index}]`}</td><td class="type">${attr.type}</td><td class="val"></td>`;
        tr.querySelector('.val').appendChild(ed.el);
        table.appendChild(tr);
        cells.set(`${inst.id}.${attr.name}${index === undefined ? '' : `[${index}]`}`, { tr, set: ed.set });
      }
    }
    det.appendChild(table);
    root.appendChild(det);
  }
  applyFilter();
  render(null);
}

function render(changes) {
  for (const [inst, attrs] of Object.entries(sim.state)) {
    if (changes && !changes[inst]) continue;
    for (const [name, value] of Object.entries(changes ? changes[inst] : attrs)) {
      const targets = Array.isArray(value)
        ? value.map((v, i) => [`${inst}.${name}[${i}]`, v])
        : [[`${inst}.${name}`, value]];
      for (const [key, v] of targets) {
        const c = cells.get(key);
        if (!c) continue;
        c.set(v);
        if (changes) { c.tr.classList.remove('flash'); void c.tr.offsetWidth; c.tr.classList.add('flash'); }
      }
    }
  }
}

function applyFilter() {
  const q = $('#filter').value.toLowerCase();
  for (const { tr } of cells.values()) tr.style.display = tr.dataset.search.includes(q) ? '' : 'none';
}

function buildEvents() {
  const root = $('#events');
  root.innerHTML = '';
  for (const ev of schema.events) {
    const box = document.createElement('div');
    box.className = 'ev';
    box.dataset.search = ev.name.toLowerCase();
    const inputs = ev.args.map((a) => {
      const i = document.createElement('input');
      i.placeholder = `${a.name} (${a.type})`;
      i.dataset.kind = a.kind;
      return i;
    });
    const btn = document.createElement('button');
    btn.textContent = 'Envoyer';
    btn.onclick = () => {
      const args = {};
      ev.args.forEach((a, k) => {
        const v = inputs[k].value;
        args[a.name] = a.kind === 'string' ? v : a.kind === 'bool' ? v === 'true' || v === '1' : Number(v);
      });
      report(sim.sendEvent(ev.name, args).then(() => log(`→ ${ev.name}${ev.args.length ? ' ' + JSON.stringify(args) : ''}`, 'evt')), ev.name);
    };
    const title = document.createElement('span');
    title.className = 'evname';
    title.innerHTML = `${ev.name} ${ev.handledBy.length ? '' : '<small>(aucun handler détecté)</small>'}`;
    box.append(title, ...inputs, btn);
    root.appendChild(box);
  }
}

$('#filter').oninput = applyFilter;
$('#evfilter').oninput = () => {
  const q = $('#evfilter').value.toLowerCase();
  for (const b of document.querySelectorAll('#events .ev')) b.style.display = b.dataset.search.includes(q) ? '' : 'none';
};

sim.onStatus((on) => {
  $('#status').textContent = on ? 'connecté' : 'déconnecté';
  $('#status').className = on ? 'on' : '';
  if (on) log('connecté');
});
sim.onInstances(() => schema && buildAttrs());
$('#reset').onclick = () => {
  if (!confirm('Relancer la simulation depuis le début ?')) return;
  report(sim.reset().then(() => log('simulation relancée…', 'evt')), 'reset');
};
sim.onState((s, changes) => schema && render(changes));
sim.onEvent((e) => log(`événement ${e.name} reçu (${e.instance})`, 'evt'));
sim.schema.then((s) => {
  schema = s;
  $('#meta').textContent = `API ${s.apiHash} — généré ${s.generatedAt}`;
  buildEvents();
  buildAttrs();
}).catch((e) => log(`schéma: ${e.message}`, 'err'));
</script>
</body>
</html>
